name: Testes e deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: simulado-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes-e-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: simulado_test
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teste -d simulado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Executar testes e gerar JAR
        env:
          DB_URL: jdbc:postgresql://localhost:5432/simulado_test
          DB_USER: teste
          DB_PASSWORD: teste
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Configurar acesso SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_KNOWN_HOSTS: ${{ secrets.AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$AWS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Enviar arquivos para a AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$AWS_USER@$AWS_HOST" \
            'mkdir -p ~/simulado/deploy/target'

          scp -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            Dockerfile \
            "$AWS_USER@$AWS_HOST:simulado/deploy/Dockerfile"

          scp -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            target/curso-0.0.1-SNAPSHOT.jar \
            "$AWS_USER@$AWS_HOST:simulado/deploy/target/curso-0.0.1-SNAPSHOT.jar"

      - name: Atualizar aplicação na AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$AWS_USER@$AWS_HOST" 'bash -se' <<'REMOTE'
          cd ~/simulado/deploy

          test -f "$HOME/simulado/app.env"
          docker network inspect simulado-network > /dev/null

          docker build -t simulado-app:latest .

          if docker container inspect simulado-app > /dev/null 2>&1; then
            docker stop simulado-app
            docker rm simulado-app
          fi

          docker run -d \
            --name simulado-app \
            --restart unless-stopped \
            --network simulado-network \
            --env-file "$HOME/simulado/app.env" \
            -p 8081:8080 \
            simulado-app:latest

          for tentativa in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 3 http://127.0.0.1:8081/ || true)

            if [ "$status" = "200" ] || [ "$status" = "404" ]; then
              echo "Aplicação respondeu na porta 8081."
              exit 0
            fi

            sleep 3
          done

          echo "A aplicação não respondeu no tempo esperado."
          docker logs --tail 80 simulado-app
          exit 1
          REMOTE

      - name: Remover chave SSH do runner
        if: always()
        run: rm -f ~/.ssh/deploy_key